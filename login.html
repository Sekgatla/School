<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In — Lounge.</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="login-page">

  <a href="index.html" class="login-back">← Home</a>

  <div class="login-logo">
    <div class="logo-circle">📖</div>
    <span class="logo-name">Lounge.</span>
  </div>

  <div class="login-card">
    <div class="login-tabs">
      <div class="login-tab active" data-tab="login">Log In</div>
      <div class="login-tab" data-tab="register">Register</div>
    </div>

    <!-- Login Form -->
    <div id="login-form">
      <div class="form-group">
        <label>Email</label>
        <input type="email" placeholder="Enter your email" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" placeholder="Enter your password" />
      </div>
      <button class="login-btn" onclick="window.location.href='dashboard.html'">Log In</button>
    </div>

    <!-- Register Form -->
    <div id="register-form" style="display:none;">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" placeholder="Enter your full name" />
      </div>
      <div class="form-group">
        <label>Student Number</label>
        <input type="text" placeholder="e.g. ST10462424" />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" placeholder="Enter your email" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" placeholder="Create a password" />
      </div>
      <button class="login-btn" onclick="window.location.href='dashboard.html'">Create Account</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
